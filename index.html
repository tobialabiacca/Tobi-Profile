<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tobi Alabi</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: linear-gradient(135deg, #ececec, #dcdcdc);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .card {
    width: 90%;
    max-width: 380px;
    background: rgba(255, 255, 255, 0.7);
    backdrop-filter: blur(20px);
    border-radius: 24px;
    padding: 30px 25px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.1);
    text-align: center;
    animation: fadeIn 0.6s ease;
    margin: 20px auto;
  }
  .profile {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    object-fit: cover;
    margin-bottom: 15px;
    border: 3px solid white;
  }
  h1 {
    margin: 5px 0;
    font-size: 22px;
    font-weight: 600;
    color: #111;
  }
  .title {
    color: #666;
    font-size: 14px;
    margin-bottom: 15px;
  }
  .info {
    font-size: 13px;
    color: #555;
    margin-bottom: 20px;
  }
  .button {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 14px;
    margin: 10px 0;
    border-radius: 12px;
    text-decoration: none;
    font-size: 15px;
    font-weight: 500;
    transition: all 0.2s ease;
    cursor: pointer;
    border: none;
    width: 100%;
    font-family: 'Inter', sans-serif;
  }
  .primary {
    background: black;
    color: white;
  }
  .secondary {
    background: rgba(0,0,0,0.05);
    color: black;
  }
  .button:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
  }
  .btn-icon {
    width: 20px;
    height: 20px;
    display: inline-block;
    flex-shrink: 0;
  }
  .footer {
    margin-top: 20px;
    font-size: 12px;
    color: #888;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<div class="card">
  <img src="profile.jpg" class="profile" alt="Tobi Alabi">
  <h1>Tobi Alabi</h1>
  <div class="title">Finance Consultant</div>
  <div class="info">
    +447943722218<br>
    tobialabiacca@gmail.com
  </div>

  <!-- Save Contact moved to top -->
  <button onclick="saveContact()" class="button secondary">
    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <polyline points="7 10 12 15 17 10"/>
      <line x1="12" y1="15" x2="12" y2="3"/>
    </svg>
    Save Contact
  </button>

  <a href="tel:+447943722218" class="button primary">
    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:white">
      <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.15 12 19.79 19.79 0 0 1 1.08 3.4 2 2 0 0 1 3.05 1.25h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.09 8.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 21 16.92z"/>
    </svg>
    Call
  </a>

  <a href="mailto:tobialabiacca@gmail.com" class="button primary">
    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:white">
      <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
      <polyline points="22,6 12,13 2,6"/>
    </svg>
    Email
  </a>

  <a href="https://thestratgist.com" class="button secondary">
    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/>
      <line x1="2" y1="12" x2="22" y2="12"/>
      <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
    </svg>
    Website
  </a>

  <a href="https://www.linkedin.com/in/tobi-moses-alabi-acca-334945a0/" class="button secondary">
    <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
      <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/>
      <rect x="2" y="9" width="4" height="12"/>
      <circle cx="4" cy="4" r="2"/>
    </svg>
    LinkedIn
  </a>

  <div class="footer">Tap to connect</div>
</div>

<script>
function saveContact() {
  var vcard = [
    "BEGIN:VCARD",
    "VERSION:3.0",
    "FN:Tobi Alabi",
    "N:Alabi;Tobi;;;",
    "TITLE:Finance Consultant",
    "TEL;TYPE=CELL:+447943722218",
    "EMAIL:tobialabiacca@gmail.com",
    "URL:https://thestratgist.com",
    "END:VCARD"
  ].join("\r\n");

  var blob = new Blob([vcard], { type: "text/vcard" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = "Tobi_Alabi.vcf";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
</script>
</body>
</html>
